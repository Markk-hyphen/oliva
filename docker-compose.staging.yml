# Overlay de staging — apila sobre docker-compose.yml + docker-compose.prod.yml
# (+ docker-compose.shared-infra.yml si la app usa infra compartida).
#
# Diferencia con prod: la imagen del backend usa el target `frankenphp_staging`,
# que hereda de frankenphp_prod y suma las dev-deps (Foundry + fixtures-bundle)
# necesarias para correr `doctrine:fixtures:load`. Las imágenes son
# `<project>-<servicio>:staging` (con `-p ong-staging` → `ong-staging-backend:staging`),
# así nunca pisan la imagen de prod (`ong-backend:prod`) en el host.
#
# Staging es UNA APP MÁS en el VPS: tiene su propia DB desechable en el Postgres
# compartido, su propio project name (-p <app>-staging) y su propio DATABASE_URL.
# Levantarlo NO interfiere con el stack de producción.
#
#   Con infra compartida (caso habitual en VPS):
#     docker compose -p <app>-staging \
#       -f docker-compose.yml -f docker-compose.prod.yml \
#       -f docker-compose.shared-infra.yml \
#       -f docker-compose.staging.yml up -d
#
#   Standalone (sin infra compartida, para pruebas locales):
#     docker compose -p <app>-staging \
#       -f docker-compose.yml -f docker-compose.prod.yml \
#       -f docker-compose.staging.yml up -d

services:
  # The one-shot migrate, like the backend: its own image (it would inherit `:prod`), APP_ENV
  # that wins over prod.yml's, and .env.staging last so it migrates the STAGING database.
  migrate:
    image: ${COMPOSE_PROJECT_NAME}-backend:staging
    build:
      target: frankenphp_staging
    environment:
      - APP_ENV=staging
    env_file: !override
      - .env
      - .env.backend
      - .env.staging

  backend:
    image: ${COMPOSE_PROJECT_NAME}-backend:staging
    build:
      target: frankenphp_staging
    # prod.yml hardcodea environment: APP_ENV=prod en backend/scheduler.
    # Precedencia de Compose: environment: > env_file: > ENV de la imagen — sin
    # este override, ese environment pisaría .env.staging y quedaría en prod
    # pese al env_file. Síntoma real: fixtures:load fallaba ("command not
    # defined") porque prod no está en bundles.php.
    environment:
      - APP_ENV=staging
    # !override reemplaza (no concatena) la lista del base: evita duplicados.
    # Requiere Docker Compose >= 2.24 (mismo requisito que shared-infra.yml).
    env_file: !override
      - .env
      - .env.backend
      - .env.staging

  scheduler:
    image: ${COMPOSE_PROJECT_NAME}-backend:staging
    build:
      target: frankenphp_staging
    environment:
      - APP_ENV=staging
    env_file: !override
      - .env
      - .env.backend
      - .env.staging

  # Igual que backend/scheduler: imagen propia de staging (si no, heredaría la `:prod` de
  # prod.yml) y APP_ENV explícito, que pisa el `APP_ENV=prod` de prod.yml (ver el gotcha de
  # precedencia arriba). .env.staging carga último: su RABBITMQ_DSN/DATABASE_URL ganan.
  worker:
    image: ${COMPOSE_PROJECT_NAME}-backend:staging
    build:
      target: frankenphp_staging
    environment:
      - APP_ENV=staging
    env_file: !override
      - .env
      - .env.backend
      - .env.staging

  # Realtime en staging: imagen propia (si no, heredaría la `:prod`). El relay además fija
  # APP_ENV y recarga la lista de env files (ver el gotcha de precedencia arriba).
  realtime:
    image: ${COMPOSE_PROJECT_NAME}-realtime:staging

  realtime-relay:
    image: ${COMPOSE_PROJECT_NAME}-backend:staging
    build:
      target: frankenphp_staging
    environment:
      - APP_ENV=staging
    env_file: !override
      - .env
      - .env.backend
      - .env.staging

  # El frontend de staging usa su PROPIA imagen, igual que el backend: sin
  # declarar este servicio heredaría la imagen `:prod` de prod.yml y un rebuild
  # en staging pisaría la que sirve producción. Mismo target `production`, solo
  # cambia el tag (el build se hereda de prod.yml).
  frontend:
    image: ${COMPOSE_PROJECT_NAME}-frontend:staging

  # Same reason as frontend: without this block a staging rebuild would
  # overwrite the prod gateway image (`<app>-gateway:prod`). The build config
  # (context, Dockerfile) is inherited from prod.yml.
  gateway:
    image: ${COMPOSE_PROJECT_NAME}-gateway:staging
