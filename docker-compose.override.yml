# Development overrides
#
# Nombres de imagen: `<project>-<servicio>:<entorno>` (acá `:dev`). El project
# name de Compose (directorio, `-p` o COMPOSE_PROJECT_NAME) los hace únicos por
# app: un tag fijo (`app-backend-dev:1.0`) es global al host y el build de una
# app pisaba la imagen de otra. Misma convención en prod.yml/staging.yml.
#
# Puertos del host por variable (con el default de siempre): dos apps Oliva en
# dev publicaban las dos los mismos 80/3000/5432 → la segunda fallaba con "port
# is already allocated". Ahora el lado-host sale de ${*_PORT:-default}: una sola
# app no cambia nada; para una segunda, poné otros valores en SU `.env` (ver el
# bloque "Dev host ports" de .env.example). El lado-container queda fijo.
services:
  database:
    ports:
      - "${DB_PORT:-5432}:5432"

  rabbitmq:
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  # The one-shot migrate (docker-compose.yml). Dev image, the host's user (a migration it
  # writes stays yours) and the backend's bind mounts: a migration you just generated is
  # applied by the next `docker compose up -d`, with no rebuild. A migration can use app
  # classes, hence src and config too.
  migrate:
    image: ${COMPOSE_PROJECT_NAME}-backend:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    build:
      target: frankenphp_dev
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/migrations:/app/migrations
      - ./backend/var:/app/var
    environment:
      APP_ENV: dev

  # El servicio vive en docker-compose.yml (profile, comando, depends_on, healthcheck);
  # acá solo lo de dev. Un consumidor no recarga código: tras editar un handler,
  # `docker compose restart worker`.
  worker:
    image: ${COMPOSE_PROJECT_NAME}-backend:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # ver backend: usuario del host en dev
    build:
      target: frankenphp_dev
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/var:/app/var
      # The JWT key pair (./oliva env init), over the config mount: same place as prod.
      - ./secrets/jwt:/app/config/jwt:ro
    environment:
      APP_ENV: dev
      # = -vv sin tocar el comando: loguea cada mensaje consumido.
      SHELL_VERBOSITY: 2
    tty: true

  # Hub de realtime en dev. Profile/entorno vienen de docker-compose.yml; acá solo el tag
  # de imagen por app y el log en DEBUG. Tras editar su Caddyfile: `docker compose restart realtime`.
  realtime:
    image: ${COMPOSE_PROJECT_NAME}-realtime:dev
    environment:
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY}
      REALTIME_LOG_LEVEL: DEBUG

  # Relay en dev: imagen del backend, usuario del host y bind-mounts como el worker. Un
  # consumidor no recarga código: tras editar un handler, `docker compose restart realtime-relay`.
  realtime-relay:
    image: ${COMPOSE_PROJECT_NAME}-backend:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # ver backend: usuario del host en dev
    build:
      target: frankenphp_dev
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/var:/app/var
      # The JWT key pair (./oliva env init), over the config mount: same place as prod.
      - ./secrets/jwt:/app/config/jwt:ro
    environment:
      APP_ENV: dev
      SHELL_VERBOSITY: 2
    tty: true

  scheduler:
    image: ${COMPOSE_PROJECT_NAME}-backend:dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"   # ver backend: usuario del host en dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: frankenphp_dev
    command: ["supercronic", "/etc/supercronic/crontab"]
    restart: unless-stopped
    env_file:
      - .env
      - .env.backend
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/src:/app/src
      - ./backend/config:/app/config
      - ./backend/var:/app/var
      # The JWT key pair (./oliva env init), over the config mount: same place as prod.
      - ./secrets/jwt:/app/config/jwt:ro
      - ./backend/scheduler/crontab:/etc/supercronic/crontab:ro
    environment:
      APP_ENV: dev
    networks:
      - app_network

  backend:
    image: ${COMPOSE_PROJECT_NAME}-backend:dev
    build:
      target: frankenphp_dev
    # Corre como el usuario del host (default = el UID/GID típico de Linux, 1000).
    # Antes corría como root → los archivos que escribe en los bind-mounts (claves
    # JWT en config/jwt, migración generada, cache en var) quedaban root-owned en el
    # host y no se podía borrar el dir sin `sudo chown`. Si tu `id -u` NO es 1000,
    # poné HOST_UID/HOST_GID en tu `.env`. Solo dev: prod.yml no define `user:` (el
    # entrypoint necesita root ahí para el setfacl que comparte var con www-data).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    # No `ports:` since 1.9.0: the backend is reached through the gateway on
    # ${GATEWAY_PORT:-80}. verify.sh and doctor exec into the container, so they
    # need no host port. CI curls ${GATEWAY_PORT:-80} too. A fork that still sets
    # BACKEND_PORT in .env gets the dev-ports upgrade warning.
    volumes:
      - ./backend/.env:/app/.env:ro
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - ./backend/public:/app/public
      - ./backend/tests:/app/tests
      # var bind-mounteado (en vez del volumen anónimo, que nace root y no es
      # escribible por el usuario del host): así cache/log quedan host-owned y se
      # esquiva el gotcha de Docker "escrituras a un path VOLUME tras declararlo se
      # pierden". El dir existe en el host por var/.gitkeep (si no, Docker lo crea
      # como root). Gitignored salvo el .gitkeep. En prod var sigue siendo el VOLUME.
      - ./backend/var:/app/var
      # phpunit.dist.xml se hornea en la imagen pero NO se bind-mountea → editarlo en
      # el host no tenía efecto dentro del container hasta rebuildear (friction T5).
      # Es config que solo se lee: montarlo lo hace surtir efecto al instante. Los
      # inputs de build (composer.json/lock, php-extensions.txt) NO se montan a
      # propósito: cambiarlos pide rebuild, no copiar el archivo; `doctor` los compara.
      - ./backend/phpunit.dist.xml:/app/phpunit.dist.xml:ro
      - ./backend/frankenphp/Caddyfile:/etc/caddy/Caddyfile
      # Dev worker block and its watch patterns: editable without a rebuild (restart backend).
      - ./backend/frankenphp/worker.dev.Caddyfile:/etc/caddy/worker.dev.Caddyfile:ro
      - ./backend/frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      - ./backend/config:/app/config
      # The JWT key pair, made by ./oliva env init (since 1.11.0; before, the backend generated
      # it at boot into backend/config/jwt). Mounted over the config mount, read-only: the
      # same place as in production.
      - ./secrets/jwt:/app/config/jwt:ro
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      APP_ENV: dev
      # Caddy/Mercure escriben su storage (mercure.db, certs, config autosave) en
      # $XDG_DATA_HOME/$XDG_CONFIG_HOME, que la imagen fija en /data y /config: dos
      # VOLUMEs root-owned que el usuario del host (user: arriba) NO puede escribir
      # → el hub Mercure fallaba con "permission denied" en /data/caddy/mercure.db.
      # Redirigidos a /app/var (bind-mount host-owned, ya montado): Caddy crea ahí sus
      # subdirs sin problema. Solo dev; en prod corre como root y usa /data|/config.
      XDG_DATA_HOME: /app/var/caddy-data
      XDG_CONFIG_HOME: /app/var/caddy-config
    extra_hosts:
      - host.docker.internal:host-gateway
    tty: true

  frontend:
    image: ${COMPOSE_PROJECT_NAME}-frontend:dev
    build:
      target: development
      args:
        NODE_ENV: development
    environment:
      - NODE_ENV=development
    # No `ports:` since 1.9.0: Vite is a plain upstream of the gateway on
    # app_network; browsers hit the gateway at ${GATEWAY_PORT:-80}. HMR's websocket
    # also rides the gateway (Vite 6 defaults clientPort to the page's port; see
    # the comment in vite.config.js). No VITE_API_URL either: the old dev proxy
    # was replaced by gateway routing, and no other file reads the var.
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules
    tty: true

  gateway:
    image: ${COMPOSE_PROJECT_NAME}-gateway:dev
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      # Editable in dev: a Caddyfile tweak or a new app.d/*.caddy surfaces on
      # `docker compose restart gateway` without a rebuild.
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gateway/app.d:/etc/caddy/app.d:ro
    environment:
      # Decision 8 of E-unbundle-roles: dev adds 'unsafe-inline' to style-src
      # (the browser console flags inline styles under the strict prod policy
      # but they are common in dev tooling and demos). Prod keeps the baked-in
      # empty default. Single policy, one knob.
      GATEWAY_CSP_STYLE_EXTRA: "'unsafe-inline'"
      GATEWAY_LOG_LEVEL: DEBUG
      # Vite dev-server listens on :3000 (strictPort). In prod the frontend is
      # Caddy on :80 (its baked-in Caddyfile), hence the default is `frontend:80`.
      GATEWAY_FRONTEND_UPSTREAM: frontend:3000
    networks:
      - app_network