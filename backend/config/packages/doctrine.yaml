doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '15'
        # Here, not in DATABASE_URL (since 1.12.0): the URL stays plain so any driver reads it.
        # Without it the client takes the cluster's default client_encoding (UTF8 on Oliva's
        # Postgres, measured; a managed one may differ).
        charset: utf8
        profiling_collect_backtrace: '%kernel.debug%'
        use_savepoints: true
        types:
            vector: Pgvector\Doctrine\VectorType
        # messenger_messages is owned by the realtime relay (profile `realtime`), which
        # creates it with `messenger:setup-transports`. Hide it from schema diffing so an
        # app WITHOUT the profile has a green `doctrine:schema:validate` even though the
        # table is absent, and `make:migration` never tries to add it (E-unbundle-roles,
        # phase 2 gate G7). The transport table name is the Messenger default.
        schema_filter: '~^(?!messenger_messages$)~'
    orm:
        auto_generate_proxy_classes: true
        enable_lazy_ghost_objects: true
        report_fields_where_declared: true
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App
        controller_resolver:
            auto_mapping: false

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            auto_generate_proxy_classes: false
            proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
