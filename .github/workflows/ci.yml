name: CI

# Flujo solo-dev: sin PRs. El CI corre DESPUÉS de mergear a main (red de
# seguridad que solo avisa cuando main se rompe) y a demanda (workflow_dispatch).
on:
  push:
    branches:
      - main
    # Los cambios SOLO-docs no corren el CI: no tocan build ni runtime. paths-ignore
    # saltea un push únicamente si TODOS sus archivos matchean — un push que mezcle
    # docs + código igual corre. workflow_dispatch siempre permite una corrida manual.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Los nombres de imagen son `${COMPOSE_PROJECT_NAME}-<servicio>:<entorno>`. bake y
# `docker compose up` derivan el project name por su cuenta (y distinto: bake usa
# "bake", compose el directorio) → sin fijarlo, `up --no-build` no encuentra la
# imagen que bake acaba de construir. Fijarlo acá los alinea.
env:
  COMPOSE_PROJECT_NAME: oliva-ci

jobs:
  tests:
    name: Tests (smoke + PHPUnit)
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        # Driver docker-container: necesario para que el caché type=gha funcione
        # (el driver docker por defecto no soporta backends de caché de buildx).
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      -
        # The same command a newcomer runs: .env from .env.example, every secret
        # generated. CI used to write its own .env.backend here, which hid for months
        # that the tracked one overrode .env; now it exercises the real path.
        name: Set up environment (./oliva env init)
        run: ./oliva env init

      -
        # El cuello de botella era rebuildear extensiones PHP + composer + yarn en
        # cada corrida (disco limpio = cero caché). bake con caché de capas de GHA:
        # con deps sin cambios el build pasa de minutos a segundos. Solo backend y
        # frontend (los únicos con build); database se pullea sola en el `up`.
        name: Build images (caché de capas GHA)
        uses: docker/bake-action@v5
        with:
          files: |
            docker-compose.yml
            docker-compose.override.yml
          targets: |
            backend
            frontend
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      -
        name: Start services
        # El dev stack corre el backend como ${HOST_UID:-1000} (T7, docker-compose.override.yml).
        # El checkout del runner NO es uid 1000, así que sin esto el container (1000) no puede
        # escribir los bind-mounts (var, config) de un árbol ajeno y el backend queda unhealthy.
        # Es el mismo paso que un host != 1000 hace en su .env; acá se toma el uid del runner.
        run: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up --wait --no-build

      -
        name: Dump service logs on failure
        if: failure()
        run: docker compose logs --tail 80

      -
        name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost/health

      -
        name: Check Mercure reachability
        # The hub answers a subscribe with an endless SSE stream, so a plain curl
        # hangs until the hub drops the connection (~9.5 min per run, measured).
        # The status line arrives in milliseconds: cut at 5 s and accept the
        # timeout (curl exit 28) as long as the answer was a 200.
        run: |
          rc=0
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
            "http://localhost/.well-known/mercure?topic=test") || rc=$?
          echo "HTTP $code (curl exit $rc; 28 = stream cut by --max-time, expected)"
          [ "$code" = 200 ] && { [ "$rc" = 0 ] || [ "$rc" = 28 ]; }

      -
        name: Run migrations
        run: docker compose exec -T backend bin/console doctrine:migrations:migrate --no-interaction

      -
        # Opt-out por fork sin editar este archivo (es de Oliva): variable de repo
        # en GitHub, ej. `gh variable set OLIVA_CI_SKIP --body schema`. Mismos
        # nombres de paso que OLIVA_VERIFY_SKIP de scripts/oliva/verify.sh.
        name: Doctrine Schema Validator
        if: ${{ !contains(vars.OLIVA_CI_SKIP, 'schema') }}
        run: docker compose exec -T backend bin/console doctrine:schema:validate

      -
        name: Run PHPUnit
        if: ${{ !contains(vars.OLIVA_CI_SKIP, 'phpunit') }}
        # test-db.sh creates and migrates the test database when a test boots the
        # kernel; with unit tests only it does nothing. Same call as `./oliva verify`.
        run: |
          scripts/lib/test-db.sh
          docker compose exec -T backend php vendor/bin/phpunit

  prod-config:
    # Guarda barata (sin build, segundos): el stack prod solo se testea acá vía
    # `config`. Atrapa la clase de bug donde un override de Compose pisa APP_ENV
    # con la palabra larga y desactiva los bloques when@prod de Symfony (cache de
    # Doctrine, auto_generate_proxy_classes). El job de tests solo levanta DEV.
    name: Prod config guard
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Minimal env files (solo para interpolar config)
        run: |
          cp .env.example .env
          : > .env.backend

      -
        name: APP_ENV resuelve a 'prod' en el stack prod (backend + scheduler)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml \
            --profile cron --profile queues config --format json > prod-config.json
          jq -e '.services.backend.environment.APP_ENV == "prod"' prod-config.json > /dev/null \
            || { echo "::error::backend APP_ENV != 'prod' en docker-compose.prod.yml — los bloques when@prod de Symfony NO se aplicarían"; exit 1; }
          jq -e '.services.scheduler.environment.APP_ENV == "prod"' prod-config.json > /dev/null \
            || { echo "::error::scheduler APP_ENV != 'prod' en docker-compose.prod.yml"; exit 1; }
          echo "✓ backend y scheduler resuelven APP_ENV=prod"

      -
        name: Worker mode de FrankenPHP NO apagado a nivel compose (backend)
        # El bug de 1.4.3: la imagen prod hornea FRANKENPHP_CONFIG="import worker.Caddyfile",
        # pero un FRANKENPHP_CONFIG='' en el env_file base (.env/.env.example) lo pisaba y
        # apagaba worker mode en silencio. `config` NO ve el ENV de la imagen, así que el
        # guard correcto es el inverso: que el stack prod no resuelva la variable a vacío.
        # Ausente = OK (gana el default horneado). Vacío = el apagado accidental vuelve.
        # (Opt-out deliberado a clásico: ver backend/docs/production.md — rompería este guard
        #  a propósito, que es justo cuándo conviene que alguien lo mire.)
        run: |
          jq -e '(.services.backend.environment.FRANKENPHP_CONFIG // "unset") != ""' prod-config.json > /dev/null \
            || { echo "::error::backend resuelve FRANKENPHP_CONFIG='' en el stack prod — worker mode quedaría APAGADO (regresión del bug de 1.4.3). No definir FRANKENPHP_CONFIG en .env/.env.example."; exit 1; }
          echo "✓ worker mode no está apagado a nivel compose"
      -
        name: Queue worker in production (profile queues) and healthchecks of their own
        # Until 1.8.0 the worker existed only in dev: messages piled up in production with
        # nothing consuming them. And every non-HTTP container of the backend image inherits
        # its HTTP healthcheck (curl :2019), which always fails there: the prod scheduler was
        # unhealthy with nothing saying so. Structural, no build.
        run: |
          jq -e '.services.worker.environment.APP_ENV == "prod"' prod-config.json > /dev/null \
            || { echo "::error::no prod worker with APP_ENV=prod under --profile queues"; exit 1; }
          jq -e '.services.worker.command == ["oliva-consume"]' prod-config.json > /dev/null \
            || { echo "::error::the prod worker does not run oliva-consume"; exit 1; }
          for s in worker scheduler; do
            if ! jq -e --arg s "$s" '.services[$s].healthcheck.test as $t
                | $t != null and ($t | tostring | test("curl") | not)' prod-config.json > /dev/null; then
              echo "::error::$s has no healthcheck of its own: it inherits the image's HTTP check and is always unhealthy"
              exit 1
            fi
          done
          echo "✓ prod worker resolves; worker and scheduler have their own healthcheck"
      -
        name: Shared infra resolves with queues (external broker)
        # The base worker depends on `rabbitmq`, which shared infra disables: without the
        # override Compose rejects the project ("depends on undefined service").
        run: |
          services="$(docker compose -p ci -f docker-compose.yml -f docker-compose.prod.yml \
            -f docker-compose.shared-infra.yml --profile cron --profile queues config --services)"
          grep -qx worker <<< "$services" || { echo "::error::shared infra + queues does not resolve a worker"; exit 1; }
          ! grep -qx rabbitmq <<< "$services" || { echo "::error::shared infra starts a local rabbitmq"; exit 1; }
          echo "✓ shared infra: worker on the external broker"

  env-contract:
    # Cheap guard (no build, seconds). Fails when the environment Compose RESOLVES is not
    # sound: a secret with a real value in a tracked file, a tracked file overriding .env
    # with a placeholder or a publicly known value, a secret reaching the frontend, a
    # manifest variable missing from .env.example. It is what stops "the container didn't
    # start, so the key went into .env.backend" from reaching main unnoticed.
    # No OLIVA_CI_SKIP for this one, on purpose. Secrets a person provides (kind `secret`,
    # value `-` in env.manifest) are not required here: CI has no real value for them.
    name: Env contract
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: .env from the manifests
        run: ./oliva env init

      -
        name: The resolved environment is sound (dev and prod stacks)
        run: |
          ./oliva env check \
            || { echo "::error::env check failed on the dev stack (see the lines marked !! above; each names its fix)"; exit 1; }
          ./oliva env check --prod \
            || { echo "::error::env check failed on the prod stack (see the lines marked !! above; each names its fix)"; exit 1; }

  composer-constraints:
    # Guarda barata (sin build): falla si backend/composer.json tiene un constraint sin
    # techo (`*`, `>=x`, `dev-main`), que deja a `composer update` instalar un major sin
    # aviso (así entró mercure-bundle 0.6). deps.sh update y sync.sh locks lo chequean
    # antes de tocar el lock; esto atrapa lo que se agrega a mano con `composer require`.
    name: Composer constraints guard
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Todo constraint de require/require-dev tiene techo
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w composer/composer:2 \
            php scripts/oliva/unbound-constraints.php backend/composer.json \
            || { echo "::error file=backend/composer.json::constraints sin techo (ver arriba): ponerles techo, ej. \">=3.7.1\" → \"^3.7.1\""; exit 1; }

  lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

  image-scan:
    # La capa que composer/yarn audit NO ven: CVEs del SO y los binarios DENTRO de
    # las imágenes base (Trivy). Report-only a propósito (no rompe main con el `|| true`):
    # un CVE de imagen base puede ser infixable hasta que el upstream rebuildee. Usa el
    # MISMO Trivy pinneado que scripts/oliva/deps.sh (una sola fuente de verdad para la
    # versión, vía `docker run` — no la trivy-action, cuyos tags estuvieron comprometidos
    # en 2026-03). Opt-out por fork: `gh variable set OLIVA_CI_SKIP --body trivy`.
    name: Image CVE scan (Trivy)
    runs-on: ubuntu-latest
    if: ${{ !contains(vars.OLIVA_CI_SKIP, 'trivy') }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4

      -
        name: Scan base images
        run: scripts/oliva/deps.sh scan-images || true
