services:
  database:
    image: pgvector/pgvector:pg${POSTGRES_VERSION:-15}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-app}"]
      interval: 10s
      retries: 5
      timeout: 5s

  rabbitmq:
    image: rabbitmq:4-management
    profiles: ["queues"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      retries: 5
      timeout: 5s

  # The database lifecycle, one shot: wait for the database, then the migrations
  # (oliva-migrate, backend/frankenphp/migrate.sh), then exit. Every PHP service waits for it
  # to exit 0. Until 1.11.0 the backend's entrypoint migrated on every start: a failed
  # migration left the backend in a restart loop while `up -d` (and so deploy.sh) reported
  # success. Now `up --wait` fails with "service migrate didn't complete successfully".
  # `docker compose up -d` runs it again each time: that is how a new migration is applied.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["oliva-migrate"]
    restart: "no"
    env_file:
      - .env
      - .env.backend
    depends_on:
      database:
        condition: service_healthy
    # Not the image's HTTP healthcheck: nothing listens here, and a one-shot is judged by its
    # exit code (service_completed_successfully), not by health.
    healthcheck:
      disable: true
    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
      - .env.backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "80/tcp"
    networks:
      - app_network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Opt-in: solo arranca si se activa el profile `cron` (--profile cron o
    # listándolo explícito en `up`). Una app sin tareas periódicas no lo levanta
    # y no paga un container corriendo un crontab vacío. Mismo criterio que
    # `rabbitmq` (profile `queues`). Cada fork que necesite cron activa el
    # profile y llena `backend/scheduler/crontab`.
    profiles: ["cron"]
    restart: unless-stopped
    env_file:
      - .env
      - .env.backend
    # Until 1.11.0 only `database`: a scheduled command could run against an unmigrated schema.
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Healthcheck propio, en el base para que lo hereden todos los overlays. Sin esto
    # hereda el HEALTHCHECK de la imagen (curl :2019/metrics), que solo pasa donde corre
    # FrankenPHP: acá corre supercronic, así que el check fallaba siempre y el scheduler
    # de prod quedaba `unhealthy` sin que nada lo dijera (el deploy no usa --wait).
    # PID 1 es el proceso mismo (el entrypoint hace exec): "PID 1 vivo" es el mínimo honesto.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Consumidor de Messenger. Opt-in con el profile `queues`, el mismo que `rabbitmq`:
    # broker y consumidor van juntos. Hasta 1.8.0 el worker existía solo en dev, y una app
    # con colas en prod encolaba mensajes que nadie procesaba, sin ningún error.
    profiles: ["queues"]
    restart: unless-stopped
    # oliva-consume (backend/frankenphp/consume-messages.sh): consume todos los transports
    # menos el de fallos de la app y recicla el proceso por tiempo/memoria. La app lo cambia con
    # WORKER_CONSUME_ARGS en .env.backend; no hace falta tocar este archivo (es de Oliva).
    command: ["oliva-consume"]
    # On SIGTERM the worker finishes the message in hand, then stops (pcntl, since 1.11.0;
    # measured: a 7 s handler completes and is acked). A handler that outlasts this grace
    # period is SIGKILLed and its message redelivered: at least once, never lost (measured
    # with a 14 s handler). An app with long handlers raises it in the project's .env.
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-10s}
    env_file:
      - .env
      - .env.backend
    # Waits for the schema (migrate exited 0) and for the backend healthy. It never migrates.
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_network

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
      additional_contexts:
        # The known-public-secrets list is Oliva's, kept with the backend. One copy, passed
        # as a named build context (no duplication). bake reads it too (measured).
        secrets: ./backend/frankenphp
    # Opt-in, like queues and cron (Oliva's philosophy: every service optional). An app with
    # no realtime pays for neither the hub nor the relay. Both live behind this one profile.
    profiles: ["realtime"]
    restart: unless-stopped
    # NO env_file: the hub owns only the Mercure verification key. Passing .env would leak
    # APP_SECRET/DATABASE_URL/JWT to it (env-check flags that). Just the one secret it uses,
    # interpolated from this project's .env (gitignored).
    environment:
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY}
      # History cap (events kept for reconnects). Not a secret; a valid default so the
      # Caddyfile never interpolates an empty size. An app overrides it in .env.
      REALTIME_HISTORY_SIZE: ${REALTIME_HISTORY_SIZE:-1000}
    networks:
      - app_network

  realtime-relay:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["realtime"]
    restart: unless-stopped
    # The only publisher to the hub: consumes the `realtime` Doctrine transport and POSTs to
    # Mercure (oliva-relay = backend/frankenphp/realtime-relay.sh). The backend just
    # dispatches the Update; its request path never waits on the hub.
    command: ["oliva-relay"]
    env_file:
      - .env
      - .env.backend
    # Waits for the schema (migrate exited 0) and the backend healthy, like the worker: the
    # relay needs the database before messenger:setup-transports. It never migrates. No
    # depends_on on `realtime`: a hub that is down must not stop the relay from draining the
    # backlog once it returns.
    depends_on:
      migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Only .env.frontend, on purpose: .env holds the backend's secrets (APP_SECRET,
    # DATABASE_URL, JWT and Mercure keys) and the frontend has no use for them. A
    # frontend variable goes in .env.frontend (non-secret) or in `environment:`.
    env_file:
      - .env.frontend
    # No depends_on backend: the frontend is a plain upstream of the gateway and
    # does not talk to the backend. The gateway has no depends_on either — a hung
    # backend must still let the gateway answer /gateway-health and the catch-all,
    # otherwise the whole stack would be marked unhealthy on a single bad upstream.
    networks:
      - app_network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    # No env_file: the gateway handles no secrets (CSP, routing and trusted
    # proxies only). env-check.sh flags a leaked secret here, same as it did for
    # the old frontend-with-routing. Per-environment knobs live in the overlays'
    # `environment:` block.
    networks:
      - app_network

networks:
  # Sin `name:` fijo a propósito: Compose la nombra `<project>_app_network`.
  # Un nombre fijo (`app_network`) es GLOBAL al host Docker → dos apps Oliva en
  # dev comparten la red y el DNS interno hace round-robin entre sus `backend`/
  # `database` (mismo bug que motivó el split de redes de infra compartida).
  app_network:
    driver: bridge

volumes:
  db_data:
  rabbitmq_data: