# Imágenes `<project>-<servicio>:prod`: el project name (-p en el VPS) las hace
# únicas por app — dos apps en el mismo host no se pisan la imagen de prod.
services:
  backend:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    build:
      target: frankenphp_prod
    restart: unless-stopped
    environment:
      - APP_ENV=prod
    volumes:
      # Claves JWT persistidas en el host (secreto gestionado, no en la imagen):
      # el entrypoint las genera una sola vez en el primer boot si el dir está
      # vacío, y de ahí en más persisten y NUNCA se regeneran (recrear el
      # container no desloguea a nadie). Backupear ./secrets/jwt + JWT_PASSPHRASE.
      - ./secrets/jwt:/app/config/jwt

  scheduler:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    build:
      target: frankenphp_prod
    restart: unless-stopped
    environment:
      - APP_ENV=prod
    # El scheduler corre supercronic (cron), NO el server frankenphp. Sin este
    # override heredaría el CMD del backend. Con $1=supercronic el bloque de
    # setup del entrypoint se saltea a propósito (solo el backend migra/genera).
    command: ["supercronic", "/etc/supercronic/crontab"]

  # El worker de producción (hasta 1.8.0 no existía). Comando, profile `queues`,
  # depends_on y healthcheck vienen de docker-compose.yml; acá solo imagen y entorno.
  worker:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    build:
      target: frankenphp_prod
    environment:
      - APP_ENV=prod

  # Realtime (profile `realtime`). El hub usa su propia imagen; el relay, la del backend.
  # Comando/profile/depends_on/healthcheck/additional_contexts vienen de docker-compose.yml.
  realtime:
    image: ${COMPOSE_PROJECT_NAME}-realtime:prod

  realtime-relay:
    image: ${COMPOSE_PROJECT_NAME}-backend:prod
    build:
      target: frankenphp_prod
    environment:
      - APP_ENV=prod

  frontend:
    image: ${COMPOSE_PROJECT_NAME}-frontend:prod
    build:
      target: production
      args:
        NODE_ENV: production
    environment:
      NODE_ENV: production
    # No `ports:` and no SERVER_NAME since 1.9.0: the frontend is reached through
    # the gateway, not directly. Its Caddyfile uses `:80` (not {$SERVER_NAME}),
    # so the variable is no longer read. Caddy data/config volumes moved to the
    # gateway, which is now the stack's edge.

  gateway:
    image: ${COMPOSE_PROJECT_NAME}-gateway:prod
    build:
      context: ./gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Caddy stores its admin and automated-CA state here. TLS is terminated at
      # the edge (shared-infra's reverse proxy) rather than at the gateway, so in
      # practice these hold mostly the admin config autosave. Preserving them
      # across restarts keeps the admin API stable.
      - gateway_caddy_data:/data
      - gateway_caddy_config:/config

volumes:
  gateway_caddy_data:
  gateway_caddy_config:
