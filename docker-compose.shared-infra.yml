# Overlay OPCIONAL: conecta esta app a una infra compartida externa
# (Postgres + RabbitMQ + reverse-proxy en su propio repo `infra`).
#
# No reemplaza a docker-compose.prod.yml: se APILA encima. Si nunca usás
# infra compartida, ignorá este archivo — el deploy standalone sigue intacto.
#
#   Standalone (DB propia, como siempre):
#     docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
#   Con infra compartida (IMPORTANTE: project name único con -p):
#     docker compose -p ong \
#       -f docker-compose.yml -f docker-compose.prod.yml \
#       -f docker-compose.shared-infra.yml up -d backend frontend scheduler
#
# ── Topología de red (split, ver README de infra) ──────────────────────────
# La infra expone DOS redes externas, y la app mantiene su red privada:
#   - app_network (privada, project-scoped) : frontend <-> backend <-> scheduler
#   - data_net    (externa, de infra)       : backend/scheduler -> postgres/rabbit
#   - proxy_net   (externa, de infra)       : reverse-proxy -> frontend
# El frontend está en app_network + proxy_net (NO en data_net → no llega a la DB).
# El backend/scheduler en app_network + data_net (NO en proxy_net).
# Así ningún `frontend`/`backend` de esta app comparte red con el de OTRA app
# → no hay colisión de DNS interno. Por eso app_network debe ser PRIVADA por
# app: se fuerza con `-p <appname>` único (de ahí el name interpolado abajo).
#
# ── Requisitos antes de usar este overlay ──────────────────────────────────
#   1. Las redes externas `proxy_net` y `data_net` deben existir (las crea el
#      repo de infra: `docker network create proxy_net && ... data_net`).
#   2. Set DATABASE_URL in the host's .env (gitignored) to the shared Postgres
#      (host `postgres`), not the local `database` — with the user/db that
#      `infra/scripts/provision-postgres.sh` provisions. Not in .env.backend:
#      it is tracked, and since Oliva 1.6.0 it holds no secrets.
#   3. El alias de `frontend` en `proxy_net` se deriva solo de
#      `${COMPOSE_PROJECT_NAME}` (ver abajo) — NO hace falta tocar nada acá.
#      Sí hay que agregar el bloque correspondiente en `infra/caddy/Caddyfile`
#      apuntando a ese alias (`-p ong` → `ong-frontend`).
#
# Requiere Docker Compose >= 2.24 (tag de merge `!override`, usada para anular
# `depends_on`/`ports`/`profiles` heredados del base — los merges de Compose
# son aditivos y no permiten borrar una clave heredada por omisión).

services:
  # database/rabbitmq locales: NO se usan en infra compartida. Profile inerte
  # = un `up -d` sin listar servicios (o con COMPOSE_PROFILES=queues resaca) NO
  # los levanta, sin importar el .env. Se pueden forzar a mano (`up -d database`).
  database:
    profiles: !override ["disabled-in-shared-infra"]

  rabbitmq:
    profiles: !override ["disabled-in-shared-infra"]

  backend:
    depends_on: !override {}
    networks:
      app_network:
      data_net:

  scheduler:
    depends_on: !override {}
    networks:
      app_network:
      data_net:

  # El broker es externo (el RabbitMQ compartido, en data_net): el depends_on del base
  # apunta a un `rabbitmq` que acá está desactivado y Compose rechazaría el proyecto
  # ("depends on undefined service"). Queda solo el backend, que es de este project y
  # sigue siendo la garantía de que el esquema está migrado antes de consumir.
  # data_net: el broker y la base compartidos (un handler suele usar Doctrine).
  worker:
    depends_on: !override
      backend:
        condition: service_healthy
    networks:
      app_network:
      data_net:

  # Since 1.9.0 the edge of the stack is the gateway, not the frontend. The
  # frontend stays on `app_network` only (it never reaches the shared Postgres
  # or RabbitMQ, so it must not be on `data_net`; and if it were also on
  # `proxy_net` under the same alias as the gateway, Docker's DNS would
  # round-robin between the two — the collision this file sidesteps on purpose).
  # Relay de realtime: lee la base compartida, así que va a data_net además de app_network.
  # depends_on como el worker (el broker externo no aplica; sí el backend ya migrado). El
  # hub (realtime) no necesita bloque: queda en app_network solo, no toca data_net ni proxy_net.
  realtime-relay:
    depends_on: !override
      backend:
        condition: service_healthy
    networks:
      app_network:
      data_net:

  frontend:
    ports: !override []
    networks:
      app_network:

  gateway:
    ports: !override []
    networks:
      app_network:
      proxy_net:
        aliases:
          # The real alias (what the shared reverse-proxy site block should
          # target from now on):
          - ${COMPOSE_PROJECT_NAME:-app}-gateway    # ej. -p ong -> ong-gateway
          # Transitional alias (same name as the pre-1.9.0 frontend's) so a
          # shared infra whose Caddyfile still says `reverse_proxy <app>-frontend:80`
          # keeps working after the upgrade. Repoint infra's Caddyfile at
          # `<app>-gateway` on the next edit; a later Oliva release will remove
          # this alias, with a labelled action in UPGRADING.md.
          - ${COMPOSE_PROJECT_NAME:-app}-frontend

networks:
  # Red privada de ESTA app, project-scoped: con `-p ong` queda `ong_app_network`,
  # con `-p crypto` queda `crypto_app_network`. Así frontend resuelve a SU backend.
  app_network:
    name: ${COMPOSE_PROJECT_NAME:-app}_app_network
  proxy_net:
    external: true
  data_net:
    external: true
